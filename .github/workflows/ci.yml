name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,ratelimit,migrations]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (type-check)
        run: mypy .

  test:
    name: Unit tests (sqlite) — py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,ratelimit,migrations]"
      - name: Pytest (sqlite, encryption exercised via the integration module)
        run: pytest --cov=auth --cov-report=term-missing

  postgres:
    name: Integration tests (PostgreSQL, encryption ON)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: auth_test
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_test -d auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_DATABASE_TYPE: postgresql
      AUTH_DATABASE_URL: postgresql://auth_test:auth_test@localhost:5432/auth_test
      AUTH_POSTGRESQL_URL: ""
      AUTH_SQLITE_PATH: ""
      AUTH_DATABASE_SCHEMA: auth_rbac
      AUTH_ENABLE_ENCRYPTION: "true"
      AUTH_ENCRYPTION_KEY: ci-encryption-key-not-a-real-secret
      AUTH_JWT_SECRET_KEY: ci-strong-jwt-secret-not-a-placeholder
      AUTH_AUDIT_PEPPER: ci-strong-audit-pepper-not-a-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,migrations]"
      - name: Wait for a real PostgreSQL connection
        # The service health-check can pass against the image's transient init
        # server; loop on an actual query so tests never hit "server closed the
        # connection unexpectedly".
        run: |
          python - <<'PY'
          import time
          import psycopg
          url = "postgresql://auth_test:auth_test@localhost:5432/auth_test"
          for i in range(30):
              try:
                  with psycopg.connect(url, connect_timeout=3) as conn:
                      conn.execute("SELECT 1")
                  print(f"postgres ready after {i}s")
                  break
              except Exception as exc:  # noqa: BLE001
                  print("waiting for postgres:", exc)
                  time.sleep(1)
          else:
              raise SystemExit("postgres did not become ready in time")
          PY
      - name: Pytest (postgres integration, encryption on)
        run: pytest tests/postgres/ -m postgres -v
